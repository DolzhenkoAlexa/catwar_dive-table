<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 Дайв-лут</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>🌊 Дайв-лут 🌊</h1>

      <div class="header-right">
        <div class="files-row">
          <button onclick="exportFile()">💾 Скачать JSON</button>
          <label class="btn">
            📂 Загрузить JSON
            <input type="file" id="fileInput" accept=".json" hidden>
          </label>
        </div>
        <nav class="accounts" id="accounts"></nav>
      </div>
    </header>

    <main class="layout">
      <div class="col col-left">
        <section class="card filter-card">
          <h2>Период</h2>
          <div class="filter-row">
            <label class="filter-field">
              <span>с</span>
              <input type="date" id="dateFrom" onchange="applyFilter()">
            </label>
            <label class="filter-field">
              <span>по</span>
              <input type="date" id="dateTo" onchange="applyFilter()">
            </label>
            <button class="filter-reset" onclick="resetFilter()" title="Сбросить">✕</button>
          </div>
          <div class="filter-presets">
            <button onclick="setPreset('today')">Сегодня</button>
            <button onclick="setPreset('yesterday')">Вчера</button>
            <button onclick="setPreset('7d')">7 дней</button>
            <button onclick="setPreset('30d')">30 дней</button>
            <button onclick="setPreset('all')">Всё</button>
          </div>
        </section>

        <section class="card chart-card">
          <div class="chart-head">
            <h2>Соотношение лута</h2>
          </div>
          <div class="chart-toggles">
            <button id="togglePos" class="toggle active" onclick="togglePos()"></button>
            <button id="toggleSuper" class="toggle active" onclick="toggleSuper()"></button>
            <button id="toggleNeg" class="toggle active" onclick="toggleNeg()"></button>
          </div>
          <div class="chart-wrap">
            <canvas id="pieChart"></canvas>
          </div>
        </section>

        <section class="card add-card">
          <h2>Добавить лут</h2>
          <div class="add-row">
            <select id="catalogSelect"></select>
            <button class="primary" onclick="addDrop()">+</button>
          </div>
        </section>
      </div>

      <div class="col col-right">
        <section class="card stats-card">
          <h2>Статистика: <span id="currentName"></span><span id="periodLabel" class="period-label"></span></h2>
          <div id="stats"></div>
        </section>

        <section class="card drops-card">
          <h2>Записи <span class="count" id="dropCount"></span></h2>
          <div id="dropsList" class="drops-list"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js?v=12"></script>
</body>
</html>
